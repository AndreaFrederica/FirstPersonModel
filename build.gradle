plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

group = 'dev.tr7zw.firstperson'
version = mod_version
base { archivesName = 'firstperson-1.12.2' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

configurations {
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    cleanroom {
        loader cleanroom_version
        runs.all {
            systemProperty('mixin.env.disableRefMap', 'true')
            systemProperty('fml.noSplash', 'true')
            systemProperty('fml.coreMods.load', 'dev.tr7zw.firstperson.mixin.FirstPersonMixinLoader')
        }
    }
    defaultRemapJar = false
    remap(tasks.named('jar').get())
    mods { remap(configurations.modRuntimeOnly) }
}

repositories { mavenCentral() }
dependencies {
    compileOnly 'com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7'
    compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Opt-in local integration runs; no third-party mod is bundled or required for normal builds.
    if (providers.gradleProperty('compatMods').isPresent()) {
        modRuntimeOnly fileTree(dir: providers.gradleProperty('compatMods').get(), include: '*.jar')
    }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property('version', project.version)
    filesMatching('mcmod.info') { expand(version: project.version) }
}
jar {
    archiveClassifier = 'dev'
    manifest.attributes(
        'ModType': 'CRL',
        'FMLCorePlugin': 'dev.tr7zw.firstperson.mixin.FirstPersonMixinLoader',
        'FMLCorePluginContainsFMLMod': 'true')
    from('LICENSE')
    finalizedBy 'remapJar'
}
