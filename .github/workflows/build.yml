name: Build 1.12.2
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew clean build --no-daemon
      - run: python3 tools/verify_artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: firstperson-1.12.2-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
